name: Set up Firebase backend

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/firebase-backend-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEACHERS_HUB_ITQSHHB_261017 }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Register Teacher's Hub web app
        run: |
          npx -y firebase-tools@latest apps:create WEB "Teacher's Hub" --project teachers-hub-itqshhb-261017
          npx -y firebase-tools@latest apps:list --project teachers-hub-itqshhb-261017
      - name: Enable Google sign-in
        run: npx -y firebase-tools@latest deploy --only auth --project teachers-hub-itqshhb-261017 --non-interactive
      - name: Enable Cloud Firestore API
        run: gcloud services enable firestore.googleapis.com --project teachers-hub-itqshhb-261017
      - name: Create Firestore database in Singapore
        run: |
          npx -y firebase-tools@latest firestore:databases:create teachers-hub-content \
            --project teachers-hub-itqshhb-261017 \
            --edition enterprise \
            --location asia-southeast1 \
            --firestore-data-access ENABLED \
            --mongodb-compatible-data-access DISABLED \
            --realtime-updates DISABLED
      - name: Publish Firestore rules
        run: npx -y firebase-tools@latest deploy --only firestore --project teachers-hub-itqshhb-261017 --non-interactive
